name: Daily outfit pick (4am CT)

# Backup cron if Netlify scheduled functions are unavailable on the plan.
# Hits the deployed function; the function itself no-ops unless Chicago hour is 4.
on:
  schedule:
    - cron: "0 9,10 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force pick even outside 4am"
        required: false
        default: "false"

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Trigger daily-select
        env:
          SITE_URL: ${{ secrets.STYLE_THRIVE_URL }}
          JOB_SECRET: ${{ secrets.DAILY_JOB_SECRET }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "STYLE_THRIVE_URL secret not set — skipping"
            exit 0
          fi
          URL="${SITE_URL%/}/.netlify/functions/daily-select"
          if [ "$FORCE" = "true" ]; then
            URL="${URL}?force=1"
          fi
          curl -fsS -X POST "$URL" \
            -H "Content-Type: application/json" \
            -H "x-job-secret: ${JOB_SECRET}" \
            -d '{}' | tee /tmp/pick.json
          echo
      - name: Generate try-on photo (off Netlify)
        env:
          SITE_URL: ${{ secrets.STYLE_THRIVE_URL }}
          DAILY_JOB_SECRET: ${{ secrets.DAILY_JOB_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$OPENAI_API_KEY" ]; then
            echo "SITE_URL or OPENAI_API_KEY missing — outfit saved without photo"
            exit 0
          fi
          node scripts/run-tryon.mjs
