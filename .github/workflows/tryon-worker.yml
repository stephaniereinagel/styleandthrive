name: Try-on photo worker

# Runs off Netlify so OpenAI image jobs aren't killed by the ~30s edge timeout.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional YYYY-MM-DD (defaults to today Chicago via API)"
        required: false
        default: ""

jobs:
  tryon:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate pending try-on
        env:
          SITE_URL: ${{ secrets.STYLE_THRIVE_URL }}
          DAILY_JOB_SECRET: ${{ secrets.DAILY_JOB_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATE: ${{ github.event.inputs.date || '' }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$DAILY_JOB_SECRET" ] || [ -z "$OPENAI_API_KEY" ]; then
            echo "Missing STYLE_THRIVE_URL, DAILY_JOB_SECRET, or OPENAI_API_KEY — skipping"
            exit 0
          fi
          node scripts/run-tryon.mjs
