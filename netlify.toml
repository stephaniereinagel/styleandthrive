[build]
  publish = "."
  functions = "netlify/functions"
  command = "npm install --omit=dev"

[functions]
  node_bundler = "esbuild"
  included_files = ["data/catalogue.json", "netlify/lib/**"]

[functions."pick-now"]
  timeout = 26

[functions."tryon"]
  timeout = 26

[functions."tryon-background"]
  timeout = 900

[functions."pending-tryon-background"]
  timeout = 900
  schedule = "*/5 * * * *"

[functions."daily-select"]
  timeout = 26
  schedule = "0 9,10 * * *"

# 09:00 and 10:00 UTC ≈ 4am America/Chicago (CST/CDT). Handler no-ops unless local hour is 4.

[[redirects]]
  from = "/app"
  to = "/"
  status = 301

[[redirects]]
  from = "/app/*"
  to = "/:splat"
  status = 301

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sketches/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
